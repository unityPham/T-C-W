<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi bạn yêu ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: fadeIn 1s ease-in-out;
        }

        .avatar {
            position: absolute;
            top: 20px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 3px solid #ff6f61;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .avatar.left {
            left: 20px;
        }

        .avatar.right {
            right: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff6f61;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            color: white;
            background-color: #ff6f61;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #ff4a3d;
            transform: scale(1.1);
        }

        #noButton {
            position: relative;
            background-color: #4b81ff;
        }

        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease-in-out;
            width: 80%;
            max-width: 500px;
        }

        .popup .heart {
            font-size: 3rem;
            color: #ff6f61;
            margin-bottom: 20px;
            animation: beat 1.5s infinite;
        }

        .popup p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .popup .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>

<body>
    <img src="https://scontent-nrt1-2.xx.fbcdn.net/v/t39.30808-6/438300765_2077023556003299_4038412896275086027_n.jpg?stp=cp6_dst-jpg_tt6&_nc_cat=107&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeGAyW_Wdg1MfqWwaBqWDNddJeocQZx8lEsl6hxBnHyUSzR8EbdL3b9w-TpSw0dWRju84AEurGEqtwQiAYXz7fG5&_nc_ohc=yYFF41JFomYQ7kNvgFC5V12&_nc_oc=AdjHueC7Qhsv8QB4JSYD1GTPWgbR-LUNW16SSH1GCfHKHn6C-mc_pEWWxyV2KIMVvso&_nc_zt=23&_nc_ht=scontent-nrt1-2.xx&_nc_gid=AAu-7jbbmUdVVbikReq1-Sa&oh=00_AYD4mFcEmDAY1m0ELuWJlUsA1nER8RRvfXpWduMERL1NjQ&oe=67BE6279"
     alt="Avatar của bạn" class="avatar left">
    <img src="https://scontent-nrt1-2.xx.fbcdn.net/v/t39.30808-6/475104683_3969180426696632_627240297991776523_n.jpg?_nc_cat=104&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeFV2xudydXVmHodSQ9FCLLz4uGy3vaJdsni4bLe9ol2ycnnCAS17Je43e059nn6Wc2FbSQpj_cjqKWZNkCEF3RY&_nc_ohc=IAq76OSZh6IQ7kNvgG29uE9&_nc_oc=Adio4Y_CFT4Rz1KUz9ALu0bEmnJLvkTjBMP7ub9jbFzRy373Y1iyDEOLq95X3CgPvlc&_nc_zt=23&_nc_ht=scontent-nrt1-2.xx&_nc_gid=AGroEpVEfdj75ivcLL0s5Hm&oh=00_AYD0saItg0tbO70uM-Zp9jn41q5KxWM8k58e6jAfUvYP-A&oe=67BE8DE0"
     alt="Avatar người yêu" class="avatar right">

    <div class="container">
        <h1>Gửi đến tình yêu của mình ❤️</h1>
        <div>
            <p>
                Bạn iu ơi, từ ngày bên bạn, trái tim mình như được thắp sáng. 
                Bạn là người khiến mình cảm thấy hạnh phúc và trọn vẹn. 
                Mình có điều quan trọng này muốn nói với bạn...
            </p>
            <button onclick="showMessage()">Nhấn vào đây bạn nhó!</button>
        </div>
    </div>

    <div id="popup" class="popup hidden">
        <div class="heart">❤️</div>
        <div id="popupContent">
            <!-- Nội dung sẽ được thay đổi bằng JavaScript -->
        </div>
        <div class="navigation">
            <button id="backButton" onclick="prevContent()">Back</button>
            <button id="nextButton" onclick="nextContent()">Next</button>
        </div>
    </div>

    <script>
        const contents = [
            "Cảm ơn bạn iu đã đồng ý yêu mình! ❤️",
            "Hôm nay mình đã vô tình làm bạn yêu buồn. Mình xin lỗi bạn nhiều nhiều nhiều ạ.",
            "Mong bạn tha thứ lỗi lầm cho kẻ vô tri này nha",
            "Mình biết mình không phải người hoàn hảo, nhưng tình yêu mình dành cho bạn là hoàn hảo nhất mà mình có thể cho đi. Bạn là người khiến mình muốn trở thành phiên bản tốt hơn mỗi ngày.",
            "Bạn biết không, dù có chuyện gì xảy ra, mình luôn ở đây để bên bạn. Bạn cứ thoải mái yếu đuối, khóc lóc hay cười đùa, mình sẽ luôn là người đồng hành cùng bạn. Nếu bạn cần khùng điên, mình sẵn sàng khùng điên cùng bạn luôn!",
            "Mình luôn mơ về ngày chúng ta có một mái ấm nhỏ, cùng nhau nấu ăn, xem phim và chia sẻ từng khoảnh khắc trong cuộc sống. Với bạn, mình tin rằng tương lai sẽ thật đẹp và tràn đầy tiếng cười.",
            "Mình hứa sẽ mãi yêu bạn, chăm sóc bạn và làm bạn cười mỗi ngày.",
            "Mình cảm thấy rất hạnh phúc vì có bạn. Nên sẽ trân trọng, yêu thương bạn nhiều hơn. Mình cũng mong được bạn yêu thương mình như vậy nữa ❤️",
            "IT củ chuối Yêu bạn Dược sĩ Meow nhiều nhiều nhiều ❤️",
        ];

        let currentContentIndex = 0;

        function showMessage() {
            window.buttonTime =  Date.now();
            const container = document.querySelector('.container > div');
            container.innerHTML = `
                <p>Bạn dược sĩ có thể đồng ý làm người yêu mình không ạ! ❤️</p>
                <div class="buttons">
                    <button onclick="showPopup()">Meow đồng ý yêu lớp phó</button>
                    <button id="noButton" onmouseover="moveButton(event)">Hông đồng ý đâu</button>
                </div>
            `;
        }

        function hiddnMessage() {
            const container = document.querySelector('.container > div');
            container.innerHTML = `
                
            `;
        }

        function showPopup() {
            if(window.buttonTime + 300 >  Date.now()) return;
            hiddnMessage();
            document.getElementById('popup').classList.remove('hidden');
            updatePopupContent();
        }

        function updatePopupContent() {
            const popupContent = document.getElementById('popupContent');
            popupContent.innerHTML = `<p>${contents[currentContentIndex]}</p>`;
            document.getElementById('backButton').disabled = currentContentIndex === 0;
            document.getElementById('nextButton').disabled = currentContentIndex === contents.length - 1;
        }

        function prevContent() {
            if (currentContentIndex > 0) {
                currentContentIndex--;
                updatePopupContent();
            }
        }

        function nextContent() {
            if (currentContentIndex < contents.length - 1) {
                currentContentIndex++;
                updatePopupContent();
            }
        }

        function moveButton(event) {
            window.buttonTime =  Date.now();
            const button = event.target;
            const buttonWidth = button.offsetWidth;
            const buttonHeight = button.offsetHeight;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            // Tính toán vị trí mới
            let newX = Math.random() * (viewportWidth - buttonWidth);
            let newY = Math.random() * (viewportHeight - buttonHeight);

            // Đảm bảo nút không quá gần vị trí chuột
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            const distance = 100; // Khoảng cách tối thiểu từ chuột

            if (Math.abs(newX - mouseX) < distance) {
                newX = mouseX + distance;
            }
            if (Math.abs(newY - mouseY) < distance) {
                newY = mouseY + distance;
            }

            // Giới hạn vị trí trong phạm vi màn hình
            newX = Math.max(0, Math.min(newX, viewportWidth - buttonWidth));
            newY = Math.max(0, Math.min(newY, viewportHeight - buttonHeight));

            button.style.position = 'fixed';
            button.style.left = `${newX}px`;
            button.style.top = `${newY}px`;
        }
    </script>
</body>

</html>
